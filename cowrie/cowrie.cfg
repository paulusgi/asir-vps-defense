# ==============================================================================
# ASIR VPS Defense - Cowrie SSH Honeypot Configuration
# Referencia: https://github.com/cowrie/cowrie/blob/master/etc/cowrie.cfg.dist
# ==============================================================================

[honeypot]

# Hostname que verán los atacantes (imita un servidor web común)
hostname = webserver01

# Rutas internas del contenedor
log_path = /cowrie/var/log/cowrie
data_path = /cowrie/var/data/cowrie
download_path = /cowrie/var/dl/cowrie
state_path = /cowrie/var/state/cowrie
share_path = /cowrie/share/cowrie
contents_path = /cowrie/share/cowrie/fs.pickle
txtcmds_path = /cowrie/share/cowrie/txtcmds
ttylog_path = /cowrie/var/lib/cowrie/tty

# Mensaje MOTD falso (imita Ubuntu Server 20.04 LTS)
# Vacío para no revelar detalles que delaten el honeypot
kernel_version = 5.4.0-182-generic
kernel_build_string = #202-Ubuntu SMP Fri Apr 26 12:29:36 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux

# Límites de sesión para evitar abuso de recursos
interactive_timeout = 120
authentication_timeout = 120
backend_ssh_port = 2222
exec_timeout = 10

# Credenciales: referencia al archivo userdb
# Se acepta todo gracias a userdb.txt con wildcard
auth_class = UserDB

# Número máximo de intentos de login por sesión (realista: 3-6)
# Igual que el MaxAuthTries del SSH real para parecerse más
auth_attempts = 6

# Usar una versión de OpenSSH que parezca real (Debian Buster)
# Coincide con el fake kernel (Ubuntu 20.04 → OpenSSH 8.2)
# La versión que anunciamos es la que verá el atacante en el banner
version_comment = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.11

# Timeout antes de desconectar si no hay actividad
# Más generoso que el SSH real para capturar más
idle_timeout = 300

# ==============================================================================
# SALIDA DE LOGS - Formato texto legible
# ==============================================================================

[output_textlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.log
format = text

# ==============================================================================
# SALIDA DE LOGS - Formato JSON (para Promtail/Loki)
# ==============================================================================

[output_jsonlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.json
# epoch_timestamp = false usa ISO 8601 compatible con Promtail
epoch_timestamp = false

# ==============================================================================
# PROTOCOLO SSH
# ==============================================================================

[ssh]

# Puerto de escucha dentro del contenedor
# El host mapea 0.0.0.0:22 → contenedor:2222
listen_addr = 0.0.0.0
listen_port = 2222

# Anunciar versión SSH falsa (debe coincidir con version_comment de arriba)
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.11

# Algoritmos de cifrado aceptados (lista amplia para capturar más clientes)
# Los atacantes modernos y legacy podrán conectar
ciphers = aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com,chacha20-poly1305@openssh.com

macs = hmac-sha2-256,hmac-sha2-512,hmac-sha1

compression = zlib@openssh.com,none

# ==============================================================================
# TELNET (desactivado - solo SSH en este proyecto)
# ==============================================================================

[telnet]
enabled = false

# ==============================================================================
# BACKEND DE SHELL FALSO
# ==============================================================================

[shell]

# Cowrie emula un shell limitado (busybox-like) con comandos reales de aspecto falso
# Los atacantes pueden ejecutar comandos pero no hacen daño real
# El sistema de archivos es de solo lectura (imagen honeypot)

# Mostrar salida de comandos fake (más realista)
show_help = true

# ==============================================================================
# ASIR VPS Defense - Cowrie SSH Honeypot Configuration (mínima)
# Solo sobreescribe lo necesario; el resto viene de cowrie.cfg.dist
# ==============================================================================

[honeypot]

# Hostname que verán los atacantes
hostname = webserver01

# Sistema operativo falso
kernel_version = 5.4.0-182-generic
kernel_build_string = #202-Ubuntu SMP Fri Apr 26 12:29:36 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux

# Backend: shell emulado (nunca proxy al sshd real)
backend = shell

# Logs al volumen montado en el host (Promtail los lee desde /var/log/host/cowrie)
log_path = /cowrie/var/log/cowrie
ttylog_path = /cowrie/var/lib/cowrie/tty

# Credenciales: acepta todo via userdb.txt (wildcard *:x:*)
auth_class = UserDB

auth_attempts = 6
interactive_timeout = 120
authentication_timeout = 120
exec_timeout = 10
idle_timeout = 300

# ==============================================================================
# LOGS
# ==============================================================================

[output_textlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.log
format = text

[output_jsonlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.json
epoch_timestamp = false

# ==============================================================================
# SSH
# ==============================================================================

[ssh]

listen_addr = 0.0.0.0
listen_port = 2222

# Banner falso visible para cualquier cliente que conecte al puerto 22
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.11

# ==============================================================================
# TELNET (desactivado)
# ==============================================================================

[telnet]
enabled = false

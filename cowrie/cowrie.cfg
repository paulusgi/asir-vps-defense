# ==============================================================================
# ASIR VPS Defense - Cowrie SSH honeypot configuration (minimal)
# Overrides only what is needed; everything else comes from cowrie.cfg.dist
# ==============================================================================

[honeypot]

# Hostname the attackers will see
hostname = webserver01

# Fake operating system
kernel_version = 5.4.0-182-generic
kernel_build_string = #202-Ubuntu SMP Fri Apr 26 12:29:36 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux

# Backend: emulated shell (never a proxy to the real sshd)
backend = shell

# Logs go to the volume mounted on the host (Promtail reads them from /var/log/host/cowrie)
log_path = /cowrie/var/log/cowrie
ttylog_path = /cowrie/var/lib/cowrie/tty

# Credentials: accept everything via userdb.txt (wildcard *:x:*)
auth_class = UserDB

auth_attempts = 6
interactive_timeout = 120
authentication_timeout = 120
exec_timeout = 10
idle_timeout = 300

# ==============================================================================
# LOGS
# ==============================================================================

[output_textlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.log
format = text

[output_jsonlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.json
epoch_timestamp = false

# ==============================================================================
# SSH
# ==============================================================================

[ssh]

listen_addr = 0.0.0.0
listen_port = 2222

# Fake banner shown to any client that connects to port 22
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.11

# ==============================================================================
# TELNET (disabled)
# ==============================================================================

[telnet]
enabled = false

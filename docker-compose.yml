services:
  # ============================================================================
  # COWRIE SSH HONEYPOT (port 22: captures real attacks)
  # The real SSH runs on an alternative port (default: 2929)
  # ============================================================================
  cowrie:
    image: cowrie/cowrie:2.9.0   # version the evidence was captured with
    container_name: asir_cowrie
    restart: always
    ports:
      - "0.0.0.0:22:2222"   # Honeypot on host port 22 → 2222 in the container
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - /var/log/cowrie:/cowrie/var/log/cowrie   # Promtail reads /var/log/host/cowrie
      - cowrie_data:/cowrie/var/lib/cowrie         # Recorded TTY sessions
    networks:
      - honeypot_net   # alone: nothing else is reachable from the honeypot
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cowrie does not need NET_BIND_SERVICE: Docker maps host:22→container:2222
    # and the container listens internally on the unprivileged port 2222
    mem_limit: "256m"
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',2222))==0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # PRIVATE ADMIN PANEL (Accessible only via SSH Tunnel)
  # ============================================================================
  admin-nginx:
    image: nginx:1.30-alpine
    container_name: asir_admin_nginx
    restart: always
    ports:
      - "127.0.0.1:8888:80" # Only binds to localhost:8888
    volumes:
      - ./nginx/conf.d/admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/html:ro
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true
    depends_on:
      - php-app

  # ============================================================================
  # APPLICATION BACKEND (PHP-FPM)
  # ============================================================================
  php-app:
    build: ./php
    container_name: asir_php
    restart: always
    user: "10001:10001" # Non-root, and not the distribution's default user (UID 1000)
    volumes:
      - ./src:/var/www/html:ro
      - ./php/conf.d/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./geoip/GeoLite2-City.mmdb:/usr/share/GeoIP/GeoLite2-City.mmdb:ro
      - ./secrets/mysql_app_password.txt:/run/secrets/mysql_app_password:ro
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - LOKI_URL=http://loki:3100
      - GEOIP_MMDB_PATH=/usr/share/GeoIP/GeoLite2-City.mmdb
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "512m"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # DATABASE (Isolated)
  # ============================================================================
  mysql:
    image: mysql:8.4
    container_name: asir_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    secrets:
      - mysql_root_password
      - mysql_app_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    # No ports exposed to host!

  # ============================================================================
  # OBSERVABILITY STACK (Loki + Promtail)
  # ============================================================================
  loki:
    image: grafana/loki:2.9.17
    container_name: asir_loki
    restart: always
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
      - /etc/localtime:/etc/localtime:ro   # host time zone
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:2.9.17
    container_name: asir_promtail
    restart: always
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log/host:ro # Read host logs (Fail2ban, Auth)
      - promtail_positions:/positions
      - /etc/localtime:/etc/localtime:ro   # auth.log and fail2ban.log carry host-local timestamps
    command: -config.file=/etc/promtail/config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:9080/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true


networks:
  honeypot_net:
    # Cowrie only. A compromised honeypot cannot reach the panel, PHP-FPM or the databases
    driver: bridge
  frontend_net:
    # Nginx <-> PHP-FPM (the panel, published on 127.0.0.1:8888 only)
    driver: bridge
  backend_net:
    # Internal network: MySQL, Loki and PHP-FPM without host-exposed ports
    internal: true

volumes:
  mysql_data:
  loki_data:
  cowrie_data:    # TTY sessions recorded by the Cowrie honeypot
  promtail_positions:

# ==============================================================================
# SECRETS (credential files, mode 600)
# ==============================================================================
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_app_password:
    file: ./secrets/mysql_app_password.txt

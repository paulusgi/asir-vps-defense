# Rate-limit only POST requests (the login form); metric polling (GET) is never limited.
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=admin_login:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    
    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=()" always;
    # Content-Security-Policy is sent by index.php, with a per-request script nonce.

    root /var/www/html;
    index index.php index.html;

    # Access Control: Only allow localhost (Docker network)
    # Since this container binds to 127.0.0.1:8888 on host, 
    # external access is already blocked by Docker.
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass php-app:9000;
        fastcgi_index index.php;
    }

    # index.php is the only entry point; includes/*.php must never run on their own
    location ~ \.php$ {
        return 404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

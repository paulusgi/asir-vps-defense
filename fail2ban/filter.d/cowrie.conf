# ==============================================================================
# Fail2Ban filter for Cowrie SSH/Telnet Honeypot
# ==============================================================================
#
# Log format example:
#   2026-03-02T23:28:00.123456Z [cowrie.ssh.factory.CowrieServerFactory] \
#     New connection: 104.234.1.73:52840 (0.0.0.0:22) [session: abc123]
#
# We match every new inbound connection attempt.
# An IP that connects to the honeypot maxretry times within findtime is banned
# from the real host; the honeypot itself stays reachable (see jail.local).
# ==============================================================================

[Definition]
failregex = ^.*New connection: <HOST>:\d+ .*$
ignoreregex =

# Cowrie writes ISO 8601 timestamps in UTC (trailing "Z"). %%z makes Fail2Ban read
# them as UTC; without it they are taken as local time, look one hour old on a
# CET host and fall outside findtime, so nothing is ever banned.
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?%%z
